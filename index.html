<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Shipping Label &amp; Fulfillment Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "shipments": "pages/shipments/shipments.html",
  "pack-bench": "pages/pack-bench/pack-bench.html",
  "batches-and-labels": "pages/batches-and-labels/batches-and-labels.html",
  "manifests": "pages/manifests/manifests.html",
  "tracking-exceptions": "pages/tracking-exceptions/tracking-exceptions.html",
  "carriers": "pages/carriers/carriers.html",
  "packages-and-rules": "pages/packages-and-rules/packages-and-rules.html",
  "freight-audit": "pages/freight-audit/freight-audit.html",
  "shipment-detail": "pages/shipment-detail/shipment-detail.html",
  "manifest-detail": "pages/manifest-detail/manifest-detail.html",
  "customs-workbench": "pages/customs-workbench/customs-workbench.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
